<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalkulatornya Lisa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            color: #00aaff;
            padding: 20px;
        }

        .calculator {
            width: 360px;
            padding: 22px;
            border-radius: 30px;
            background: #080808;
            border: 2px solid #008cff;
            box-shadow:
                0 0 15px #008cff,
                0 0 40px rgba(0, 140, 255, 0.35);

        /* GAMBAR GOJO */
        .gojo {
            width: 130px;

            border-radius: 50%;

            border: 3px solid #00aaff;
            box-shadow: 0 0 20px #008cff;
        }

        .gojo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .title {
            text-align: center;
            margin-bottom: 18px;
        }

        .title h1 {
            color: #00aaff;
            font-size: 25px;
            text-shadow: 0 0 10px #008cff;
        }

        .title p {
            margin-top: 6px;
            font-size: 12px;
            color: #5fcaff;
            letter-spacing: 2px;
        }

        .display {
            width: 100%;
            height: 75px;
            border: 2px solid #0077cc;
            border-radius: 18px;
            background: #000;
            color: #00b7ff;
            font-size: 30px;
            text-align: right;
            padding: 12px;
            outline: none;
            margin-bottom: 18px;
            box-shadow: inset 0 0 15px rgba(0, 140, 255, 0.25);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border-radius: 16px;
            border: 1px solid #006dcc;
            background: #101010;
            color: #00aaff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 8px rgba(0, 140, 255, 0.2);
        }

        button:hover {
            background: #00243b;

            transform: translateY(-2px);
        }

            transform: scale(0.92);
        }

            background: #003b66;

            grid-column: span 2;

    </style>
</head>

<body>

<div class="calculator">

    <!-- FOTO GOJO -->
    <div class="gojo">
        <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477"
             alt="Gojo Satoru">
    </div>

    <!-- JUDUL -->
    <div class="title">
        <h1>💙 Kalkulatornya Lisa 💙</h1>
        <p>GOJO SATORU EDITION</p>
    </div>

    <!-- LAYAR -->
    <input
        type="text"
        id="display"
        class="display"
        value="0"
        readonly
    >

    <!-- TOMBOL -->
    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="deleteNumber()">⌫</button>
        <button onclick="append('%')">%</button>
        <button class="operator" onclick="append('/')">÷</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="operator" onclick="append('*')">×</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="operator" onclick="append('-')">−</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button class="operator" onclick="append('+')">+</button>

        <button class="zero" onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>

        <button class="equal" onclick="calculate()">=</button>

    </div>

    <div class="footer">
        ⚡ <span>Lisa × Gojo</span> | Dark Blue Calculator
    </div>

</div>


<script>

    const display = document.getElementById("display");

    function append(value) {

        if (display.value === "0" && !isNaN(value)) {
            display.value = value;
        } else {
            display.value += value;
        }

    }

    function clearDisplay() {
        display.value = "0";
    }

    function deleteNumber() {

        if (display.value.length > 1) {
            display.value = display.value.slice(0, -1);
        } else {
            display.value = "0";
        }

    }

    function calculate() {

        try {

            let expression =
                display.value.replace(/%/g, "/100");

            let result =
                Function('"use strict"; return (' +
                expression +
                ')')();

            if (!isFinite(result)) {
                display.value = "Error";
            } else {
                display.value = result;
            }

        } catch {

            display.value = "Error";

        }

    }

    // Keyboard support
    document.addEventListener("keydown", function(event) {

        const key = event.key;

        if (
            (key >= "0" && key <= "9") ||
            key === "+" ||
            key === "-" ||
            key === "*" ||
            key === "/" ||
            key === "." ||
            key === "%"
        ) {
            append(key);
        }

        if (key === "Enter") {
            calculate();
        }

        if (key === "Backspace") {
            deleteNumber();
        }

        if (key === "Escape") {
            clearDisplay();
        }

    });

</script>

</body>
</html>
