<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Gojo Lisa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            color: white;
        }

        .calculator {
            width: 340px;
            padding: 20px;
            border-radius: 25px;
            background: #0d0d0d;
            border: 2px solid #008cff;
            box-shadow: 0 0 30px #006eff;
        }

        h1 {
            text-align: center;
            color: #00aaff;
            margin-bottom: 15px;
            font-size: 25px;
            text-shadow: 0 0 10px #008cff;
        }

        .gojo {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 18px;
            margin-bottom: 15px;
            border: 2px solid #008cff;
        }

        #display {
            width: 100%;
            height: 65px;
            margin-bottom: 15px;
            border: none;
            outline: none;
            border-radius: 15px;
            background: #181818;
            color: #00b7ff;
            text-align: right;
            padding: 10px 15px;
            font-size: 28px;
            box-shadow: inset 0 0 10px #006eff;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 15px;
            background: #151515;
            color: white;
            font-size: 21px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 5px #008cff;
        }

        button:hover {
            background: #008cff;
            color: black;
            transform: scale(1.05);
        }

        .operator {
            color: #00aaff;
        }

        .clear {
            color: #ff4d4d;
        }

        .equal {
            background: #008cff;
            color: black;
            font-weight: bold;
        }

        .zero {
            grid-column: span 2;
        }

        .footer {
            text-align: center;
            margin-top: 15px;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>⚡ KALKULATOR GOJO LISA ⚡</h1>

    <!-- Ganti URL gambar ini jika ingin memakai gambar Gojo lain -->
    <img class="gojo"
         src="https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80"
         alt="Gojo">

    <input type="text" id="display" value="0" disabled>

    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">AC</button>
        <button onclick="deleteNumber()">⌫</button>
        <button class="operator" onclick="add('%')">%</button>
        <button class="operator" onclick="add('/')">÷</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button class="operator" onclick="add('*')">×</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button class="operator" onclick="add('-')">−</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button class="operator" onclick="add('+')">+</button>

        <button class="zero" onclick="add('0')">0</button>
        <button onclick="add('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>

    </div>

    <div class="footer">
        ✦ Dibuat untuk Lisa • SMK 5 Bone • TJKT ✦
    </div>

</div>

<script>
    let display = document.getElementById("display");

    function add(value) {
        if (display.value === "0") {
            display.value = value;
        } else {
            display.value += value;
        }
    }

    function clearDisplay() {
        display.value = "0";
    }

    function deleteNumber() {
        display.value = display.value.slice(0, -1);

        if (display.value === "") {
            display.value = "0";
        }
    }

    function calculate() {
        try {
            let result = display.value
                .replace(/÷/g, "/")
                .replace(/×/g, "*");

            display.value = eval(result);
        } catch {
            display.value = "Error";
        }
    }
</script>

</body>
</html>
